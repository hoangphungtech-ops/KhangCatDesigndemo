<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Admin Dashboard — KHANGCAT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800;900&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
  </head>
  <body>
    <main class="admin-page">
      <section class="admin-shell">
        <div class="admin-page-head">
          <div><span class="eyebrow">Internal CRM</span><h1>KHANGCAT Admin Dashboard</h1><p data-admin-stat>Đang tải...</p></div>
          <div><button class="btn" type="button" data-refresh>Tải lại</button><button class="btn btn-primary" type="button" data-test-mail>Test mail admin</button></div>
        </div>
        <p class="form-status" data-mail-status></p>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>STT</th><th>Mã hồ sơ</th><th>Tên KH</th><th>SĐT</th><th>Dự án</th><th>Thời gian</th><th>Trạng thái</th></tr></thead>
            <tbody data-admin-rows></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="js/admin-page.js"></script>
  </body>
</html>
